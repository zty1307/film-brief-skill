interface:
  display_name: "影视简报样本清洗"
  short_description: "脚本预清洗，AI形成9—16个本期观点并审每组最多10条，沿用原工作台"
  default_prompt: "Use $film-brief-cleaning in one host conversation with a 30-minute budget. For raw Excel input, use scripts/final_sample_review.py prepare --discover-viewpoints: scripts preprocess, AI discovers 9-16 current-period report-style viewpoints, scripts rank candidates, and AI verifies up to 10 displayed excerpts per viewpoint. Do not run full-source reviews or the old multistage controller. For an assigned input/answer packet, only review that packet; do not operate the full workflow. Preserve templates/workbench.html styling and interactions. Track all native workers and close every own persistent teammate after publication, including first-round members."

policy:
  allow_implicit_invocation: true
