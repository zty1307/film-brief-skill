<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视简报观点工作台</title>
<style>
:root{--ink:#202938;--muted:#667085;--paper:#eef1f5;--panel:#ffffff;--line:#d5dbe4;--deep:#243247;--accent:#3f6282;--soft:#f5f7fa;--shadow:0 12px 28px rgba(31,44,61,.07)}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
button,input{font:inherit} button{cursor:pointer} .app{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:28px 18px 22px;background:var(--deep);color:#f7f3ea;display:flex;flex-direction:column}
.brand{padding:0 8px 25px;border-bottom:1px solid rgba(255,255,255,.12);font:700 20px/1.2 "STSong","SimSun",serif;letter-spacing:.12em}
.periods{flex:1 1 auto;min-height:0;margin-top:24px;padding:0 4px 10px 0;display:grid;align-content:start;gap:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable} .period{width:100%;border:0;background:transparent;color:#b9c5c0;text-align:left;border-radius:4px;padding:13px 13px 13px 30px;position:relative;line-height:1.35}
.periods{scrollbar-width:thin;scrollbar-color:#617187 transparent}.periods::-webkit-scrollbar{width:6px}.periods::-webkit-scrollbar-thumb{background:#617187;border-radius:6px}.periods::-webkit-scrollbar-track{background:transparent}
.period:before{content:"";position:absolute;left:13px;top:50%;width:5px;height:5px;border-radius:50%;background:#718096;transform:translateY(-50%)}
.period:hover{background:rgba(255,255,255,.06);color:#fff} .period.active{background:#f5f7fa;color:var(--deep);font-weight:700}
.period.active:before{background:var(--accent)} .period b{display:block;font-size:14px;margin-bottom:3px} .period small{font-size:11px;opacity:.72;font-weight:400}
.side-foot{margin-top:auto;padding:18px 8px 0;border-top:1px solid rgba(255,255,255,.10);color:#91a0b4;font-size:11px;line-height:1.7}
.main{min-width:0} .topbar{height:68px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.topbar strong{font-size:15px;letter-spacing:.08em} .search{margin-left:auto;width:min(330px,42vw)} .search input{width:100%;border:1px solid #cbd3df;background:#f8fafc;padding:9px 13px;border-radius:3px;outline:none;color:var(--ink)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,98,130,.11)} .page{max-width:1060px;margin:0 auto;padding:40px 42px 72px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px;padding-bottom:19px;border-bottom:1px solid var(--line)} h1{font:700 32px/1.2 "STSong","SimSun",serif;letter-spacing:.04em;margin:0}
.meta{color:var(--muted);font-size:13px} .stance-tabs{display:flex;align-items:flex-end;gap:28px;margin:-8px 0 24px;border-bottom:1px solid var(--line)} .stance-tab{display:flex;align-items:baseline;gap:7px;border:0;border-bottom:2px solid transparent;background:transparent;color:#758093;padding:12px 2px 11px;font-size:14px;font-weight:700;white-space:nowrap} .stance-tab small{font:11px/1 "Microsoft YaHei","PingFang SC",sans-serif;color:#9aa4b2;font-weight:400} .stance-tab:hover{color:#34465c} .stance-tab.active{color:#2f5679;border-bottom-color:var(--accent)} .stance-tab.active small{color:#607d98} .stance-tab[data-stance="negative"].active{color:#765354;border-bottom-color:#916c6e} .content{display:grid;gap:24px} .cluster{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.cluster:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)} .cluster-head{position:relative;display:block;width:100%;border:0;background:transparent;text-align:left;padding:19px 58px 16px 28px;user-select:none}.cluster-head:hover{background:#f8fafc}.cluster-head:after{content:"";position:absolute;right:26px;top:29px;width:8px;height:8px;border-right:2px solid #667e96;border-bottom:2px solid #667e96;transform:rotate(45deg)}.cluster-head[aria-expanded="false"]:after{transform:rotate(-45deg)}
.cluster-title{display:block;font:700 19px/1.5 "STSong","SimSun",serif;color:#26364b}
.cluster-count{display:block;margin-top:4px;color:var(--muted);font-size:12px} .samples{border-top:1px solid #e1e6ed;padding:13px 24px 19px 28px;display:grid;gap:9px}
.sample{display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;border:1px solid #dde3eb;border-radius:8px;background:#fbfcfe;padding:12px 14px}
.sample.selectable{grid-template-columns:26px 124px minmax(0,1fr)}
.sample.selectable:has(.sample-check:checked){border-color:#95adbf;background:#f1f6fb}
.sample-check-label{display:grid;place-items:start center;min-height:30px;padding-top:2px;cursor:pointer}
.sample-check{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:1px 0 0}
.source-meta{font-size:12px;color:var(--muted);line-height:1.55} .source-meta .channel{display:block;color:#405f7b;font-weight:700;margin-bottom:5px}
.source-author{color:#465366;font-weight:700;word-break:break-word} .source-date{margin-top:3px;color:#8a94a4;font-size:11px} .excerpt{font-size:13.5px;line-height:1.78;color:#3f4a5a}
.sample-actions{display:flex;gap:12px;align-items:center;margin-top:8px} .text-btn,.source-link{border:0;background:none;padding:0;color:var(--accent);font-size:12px;text-decoration:none}
.text-btn:hover,.source-link:hover{text-decoration:underline} .fulltext{display:none;margin-top:11px;padding:12px 14px;background:#f3f6fa;border-left:2px solid #9cb0c4;color:#526072;font-size:12.5px;line-height:1.72;white-space:pre-wrap;max-height:340px;overflow:auto}
.fulltext.open{display:block} .more{display:block;margin:10px auto 0;border:1px solid #cbd3df;background:#f8fafc;color:#46566a;border-radius:3px;padding:8px 15px}
.hidden-sample{display:none} .cluster.collapsed .samples{display:none} .empty{padding:54px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line)} mark{background:#dbe8f5;color:inherit;padding:0 .06em}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:20px}.periods{grid-template-columns:repeat(3,1fr);margin-top:16px;padding:0;overflow:visible;scrollbar-gutter:auto}.period{padding:10px 8px;text-align:center}.period:before,.side-foot{display:none}.topbar{padding:0 18px}.page{padding:28px 16px 50px}.stance-tabs{gap:22px;overflow-x:auto}.cluster-head{padding:22px 62px 18px 24px}.samples{padding:12px 18px 18px 24px}.sample{grid-template-columns:1fr;gap:8px}.sample.selectable{grid-template-columns:22px minmax(0,1fr)}.sample.selectable .sample-check-label{grid-row:1 / span 2}.sample.selectable .sample-detail{grid-column:2}}
@media(max-width:540px){.periods{grid-template-columns:1fr}.search{width:52vw}.page-head{align-items:center}h1{font-size:26px}}
.category-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}.category-tab{border:1px solid #cbd3df;background:#fff;color:#46566a;border-radius:3px;padding:7px 12px;cursor:pointer}.category-tab.active{background:#003366;color:#fff;border-color:#003366}
.selection-bar{position:sticky;top:68px;z-index:9;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:22px;box-shadow:0 5px 16px rgba(31,44,61,.07)}
.selection-bar[hidden]{display:none}
.selection-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selection-summary{margin-right:auto;font-size:13px;font-weight:700;color:#334c64}
.selection-actions{display:flex;gap:8px;align-items:center}
.selection-actions button{min-height:34px;padding:6px 11px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:13px}
.selection-actions .primary{background:#315574;color:white}.selection-actions .primary:hover:not(:disabled){background:#274867}
.selection-actions button:not(.primary):hover:not(:disabled){background:#f1f5f8;color:var(--ink)}
.selection-actions button:disabled{opacity:.5;cursor:default}
.selection-hint,.selection-message{font-size:12px;line-height:1.55;margin:7px 0 0}
.selection-hint{color:var(--muted)}.selection-message{color:#79562c}
#selectionMessage:empty{display:none}
.cluster-head:focus-visible,.sample-check:focus-visible,.selection-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">影视简报</div><div class="periods" id="periods"></div></aside>
  <main class="main">
    <header class="topbar"><strong>观点工作台</strong><label class="search"><input id="search" type="search" placeholder="搜索观点、作者或正文"></label></header>
    <div class="page"><div class="page-head"><h1 id="batchTitle"></h1><div class="meta" id="batchMeta"></div></div><div class="selection-bar" id="selectionBar" hidden><div class="selection-controls"><strong class="selection-summary" id="selectionSummary" aria-live="polite">已选 0 个观点 · 0 条样本</strong><div class="selection-actions"><button type="button" id="clearSelection" disabled>清空选择</button><button type="button" id="exportSelection" class="primary" disabled>导出写稿选材</button></div></div><p class="selection-hint">勾选观点和样本后导出文件，再发回 WorkBuddy，即可直接写稿。</p><p class="selection-message" id="selectionMessage" role="status"></p></div><nav class="stance-tabs" id="stanceTabs" aria-label="观点立场"></nav><nav class="category-tabs" id="categoryTabs" aria-label="观点方面"></nav><section class="content" id="content"></section></div>
  </main>
</div>
<script>
const DATA=@@FILM_BRIEF_DATA@@;
const STANCES=[['positive','正面'],['objective','客观'],['negative','负面']];
let current=0; let query=""; let activeStance='positive'; let activeCategory='all';
const periods=document.getElementById('periods');
const batchTitle=document.getElementById('batchTitle');
const batchMeta=document.getElementById('batchMeta');
const search=document.getElementById('search');
const stanceTabs=document.getElementById('stanceTabs');
const categoryTabs=document.getElementById('categoryTabs');
const content=document.getElementById('content');
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const displayBody=s=>String(s??"").replace(/\\n/g,"\n");
function highlight(text){const safe=E(text);if(!query)return safe;const needle=E(query).toLowerCase();const lower=safe.toLowerCase();let out='',pos=0,hit=-1;while((hit=lower.indexOf(needle,pos))>=0){out+=safe.slice(pos,hit)+`<mark>${safe.slice(hit,hit+needle.length)}</mark>`;pos=hit+needle.length;}return out+safe.slice(pos);}
function renderPeriods(){periods.innerHTML=DATA.batches.map((b,i)=>`<button class="period ${i===current?'active':''}" data-i="${i}"><b>${E(b.name)}</b><small>${b.count} 条样本 · ${b.clusterCount} 个观点簇</small></button>`).join('');}
function sampleHtml(item,index){
  const hidden=index>=5?' hidden-sample':'';
  const selectable=DATA.selection?' selectable':'';
  const checkbox=DATA.selection?`<label class="sample-check-label"><input class="sample-check" type="checkbox" data-select-sample="${E(item.candidateId)}" aria-label="勾选样本：${E(item.author)}"></label>`:'';
  const sourceLink=item.url?`<a class="source-link" href="${E(item.url)}" target="_blank" rel="noreferrer">打开来源</a>`:'';
  return `<article class="sample${selectable}${hidden}">${checkbox}<div class="source-meta"><span class="channel">${E(item.channel)}</span><div class="source-author">${highlight(item.author)}</div><div class="source-date">${E(item.publishedAt)}</div></div><div class="sample-detail"><div class="excerpt">${highlight(item.displayExcerpt??item.excerpt)}</div><div class="sample-actions"><button type="button" class="text-btn" data-full>展开原文</button>${sourceLink}</div><div class="fulltext">${highlight(displayBody(item.body))}</div></div></article>`;
}
function clusterHtml(cluster){
  const visible=cluster.items.filter(x=>!query||(x.author+' '+x.title+' '+x.excerpt+' '+x.body).toLowerCase().includes(query));
  if(!visible.length)return '';
  const more=visible.length>5?`<button type="button" class="more" data-more>展开其余 ${visible.length-5} 条</button>`:'';
  return `<section class="cluster" data-cluster="${E(cluster.id)}"><button type="button" class="cluster-head" aria-expanded="true"><span class="cluster-title">${highlight(cluster.title)}</span><span class="cluster-count">${visible.length} 条样本</span></button><div class="samples">${visible.map(sampleHtml).join('')}${more}</div></section>`;
}
function availableStances(batch){return STANCES.filter(([key])=>batch.clusters.some(c=>(c.stance||'objective')===key));}
function ensureActiveStance(batch){const keys=availableStances(batch).map(([key])=>key);if(!keys.includes(activeStance))activeStance=keys[0]||'positive';}
function renderStanceTabs(batch){stanceTabs.innerHTML=availableStances(batch).map(([key,label])=>{const clusters=batch.clusters.filter(c=>(c.stance||'objective')===key);const count=clusters.reduce((sum,c)=>sum+c.count,0);return `<button class="stance-tab ${key===activeStance?'active':''}" data-stance="${key}"><span>${label}</span><small>${count} 条样本 · ${clusters.length} 个观点簇</small></button>`;}).join('');}
function renderCategoryTabs(batch){const categories=[...new Set(batch.clusters.filter(c=>(c.stance||'objective')===activeStance).map(c=>c.category).filter(Boolean))];if(!categories.includes(activeCategory))activeCategory='all';categoryTabs.innerHTML=categories.length?['all',...categories].map(category=>`<button class="category-tab ${category===activeCategory?'active':''}" data-category="${E(category)}">${E(category==='all'?'全部方面':category)}</button>`).join(''):'';}
function stanceClusters(batch){const cards=batch.clusters.filter(c=>(c.stance||'objective')===activeStance&&(activeCategory==='all'||c.category===activeCategory)).map(clusterHtml).filter(Boolean);return cards.join('');}
function render(){const batch=DATA.batches[current];ensureActiveStance(batch);batchTitle.textContent=batch.name;batchMeta.textContent=`${batch.count} 条样本 · ${batch.clusterCount} 个观点簇`;renderStanceTabs(batch);renderCategoryTabs(batch);content.innerHTML=stanceClusters(batch)||'<div class="empty">当前分类没有匹配样本</div>';renderPeriods();if(DATA.selection)syncSelection();}
periods.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;current=Number(b.dataset.i);activeStance='positive';query='';search.value='';render();});
stanceTabs.addEventListener('click',e=>{const b=e.target.closest('[data-stance]');if(!b)return;activeStance=b.dataset.stance;render();});
categoryTabs.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;activeCategory=b.dataset.category;render();});
search.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();document.querySelectorAll('.hidden-sample').forEach(x=>x.classList.remove('hidden-sample'));document.querySelectorAll('[data-more]').forEach(x=>x.remove());});
content.addEventListener('click',e=>{if(e.target.closest('.sample-check-label'))return;const full=e.target.closest('[data-full]');if(full){const box=full.closest('.sample').querySelector('.fulltext');box.classList.toggle('open');full.textContent=box.classList.contains('open')?'收起原文':'展开原文';return;}const more=e.target.closest('[data-more]');if(more){more.closest('.samples').querySelectorAll('.hidden-sample').forEach(x=>x.classList.remove('hidden-sample'));more.remove();return;}const head=e.target.closest('.cluster-head');if(head){const collapsed=head.parentElement.classList.toggle('collapsed');head.setAttribute('aria-expanded',String(!collapsed));}});
@@SELECTION_SCRIPT@@
render();
</script>
</body></html>
