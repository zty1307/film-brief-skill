interface:
  display_name: "影视简报样本清洗"
  short_description: "清洗多渠道影视舆情样本，聚类观点并生成可核验离线工作台"
  default_prompt: "Use $film-brief-cleaning and only its film_workflow.py controller. Follow workflow_status.json one gate at a time, process every input_files chunk, and never create or deliver HTML yourself. The official workbench exists only after status is COMPLETE and verification is PASS. Open that published HTML for visual inspection; merge cumulative workbenches only through the controller."

policy:
  allow_implicit_invocation: true
